<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="../assets/favicon-32.png">
    <title>Vynzo — Choose a new password</title>
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/reset.css">
    <style>
      body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: var(--bg-dark); color: var(--text-dark); }
      .auth-card { background: var(--card-dark); padding: 32px; border-radius: 12px; width: 100%; max-width: 400px; border: 1px solid var(--border-color); }
      .auth-card h2 { color: var(--primary); margin-bottom: 16px; text-align: center; }
      .form-group { margin-bottom: 16px; }
      .form-group label { display: block; margin-bottom: 6px; font-size: 14px; color: var(--text-muted); }
      .form-group input { width: 100%; padding: 10px; border-radius: 6px; background: var(--bg-dark); border: 1px solid var(--border-color); color: var(--text-dark); }
      .btn-submit, .btn-cancel { display: block; width: 100%; padding: 12px; border-radius: 6px; font-weight: 600; text-align: center; box-sizing: border-box; }
      .btn-submit { background: var(--primary); color: white; cursor: pointer; margin-top: 8px; }
      .btn-submit:disabled { opacity: 0.65; cursor: wait; }
      .btn-cancel { margin-top: 8px; border: 1px solid var(--border-color, #444); color: var(--text-muted); text-decoration: none; }
      .error, .success { font-size: 13px; margin-bottom: 12px; text-align: center; }
      .error { color: #ff3366; }
      .success { color: #35c98a; }
    </style>
    <link rel="stylesheet" href="../css/theme.css?v=3">
    <script src="../js/theme.js?v=1"></script>
</head>
<body class="dark-theme">
    <main class="auth-card">
        <h2>Choose a new password</h2>
        <div id="error-message" class="error" role="alert" aria-live="polite"></div>
        <div id="success-message" class="success" role="status" aria-live="polite" hidden></div>
        <form id="reset-password-form" hidden>
            <div class="form-group">
                <label for="password">New password</label>
                <input type="password" id="password" required minlength="6" autocomplete="new-password">
            </div>
            <div class="form-group">
                <label for="confirm-password">Confirm new password</label>
                <input type="password" id="confirm-password" required minlength="6" autocomplete="new-password">
            </div>
            <button type="submit" class="btn-submit">Update password</button>
        </form>
        <a id="login-link" href="login.html" class="btn-cancel">Back to login</a>
        <a id="home-link" href="../index.html" class="btn-cancel" hidden>Continue to Vynzo</a>
    </main>
    <script type="module" src="../js/password-recovery.js"></script>
</body>
</html>
