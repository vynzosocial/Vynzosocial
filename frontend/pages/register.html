<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="../assets/favicon-32.png">
    <title>Vynzo — Register</title>
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/reset.css">
    <style>
      body { display: flex; justify-content: center; align-items: center; height: 100vh; background: var(--bg-dark); color: var(--text-dark); }
      .auth-card { background: var(--card-dark); padding: 32px; border-radius: 12px; width: 100%; max-width: 400px; border: 1px solid var(--border-color); }
      .auth-card h2 { color: var(--primary); margin-bottom: 24px; text-align: center; }
      .form-group { margin-bottom: 16px; }
      .form-group label { display: block; margin-bottom: 6px; font-size: 14px; color: var(--text-muted); }
      .form-group input, .form-group select { width: 100%; padding: 10px; border-radius: 6px; background: var(--bg-dark); border: 1px solid var(--border-color); color: var(--text-dark); }
      .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      .form-row-3 { grid-template-columns: 0.8fr 1.4fr 1fr; }
      .btn-submit { width: 100%; padding: 12px; background: var(--primary); color: white; font-weight: 600; border-radius: 6px; cursor: pointer; margin-top: 8px; }
      .btn-cancel { display: block; width: 100%; padding: 12px; margin-top: 8px; text-align: center; border: 1px solid var(--border-color, #444); border-radius: 6px; color: var(--text-muted); font-weight: 600; text-decoration: none; box-sizing: border-box; }
      .btn-cancel:hover { color: #fff; border-color: var(--primary); }
      .auth-footer { text-align: center; margin-top: 16px; font-size: 14px; color: var(--text-muted); }
      .auth-footer a { color: var(--primary); }
      .error { color: #ff3366; font-size: 13px; margin-bottom: 12px; text-align: center; }
      .success { color: #35c98a; font-size: 13px; margin-bottom: 12px; text-align: center; }
      .consent-group { display: grid; gap: 10px; margin: 4px 0 8px; }
      .consent-item { display: flex; align-items: flex-start; gap: 10px; font-size: 13px; line-height: 1.4; color: var(--text-muted); cursor: pointer; }
      .consent-item input { flex: 0 0 auto; width: 18px; height: 18px; margin-top: 1px; accent-color: var(--primary); }
      .consent-item a { color: var(--primary); text-decoration: underline; }
      body { height: auto; min-height: 100vh; padding: 20px 0; }
    </style>
    <link rel="stylesheet" href="../css/theme.css?v=3">
    <script src="../js/theme.js?v=1"></script>
    <script src="../js/i18n.js?v=4"></script>
</head>
<body class="dark-theme">
    <div class="auth-card">
        <h2>Join Vynzo</h2>
        <div id="error-message" class="error"></div>
        <div id="success-message" class="success" role="status" aria-live="polite" hidden></div>
        <form id="register-form">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" maxlength="60" autocomplete="username" required aria-describedby="username-hint">
                <small id="username-hint">Use 2–30 characters: letters, numbers, emoji, periods, underscores, or hyphens.</small>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="first_name">First name</label>
                    <input type="text" id="first_name" maxlength="60" autocomplete="given-name" required>
                </div>
                <div class="form-group">
                    <label for="last_name">Last name</label>
                    <input type="text" id="last_name" maxlength="60" autocomplete="family-name" required>
                </div>
            </div>
            <div class="form-group">
                <label for="birth_day">Date of birth</label>
                <div class="form-row form-row-3">
                    <select id="birth_day" aria-label="Day of birth" required><option value="">Day</option></select>
                    <select id="birth_month" aria-label="Month of birth" required><option value="">Month</option></select>
                    <select id="birth_year" aria-label="Year of birth" required><option value="">Year</option></select>
                </div>
            </div>
            <div class="form-group">
                <label for="country">Country</label>
                <select id="country" autocomplete="country-name" required><option value="">Select country</option></select>
            </div>
            <div class="form-group">
                <label for="email">Email (optional if you add a phone number)</label>
                <input type="email" id="email" maxlength="255" autocomplete="email">
            </div>
            <div class="form-group">
                <label for="phone">Phone number (optional if you add an email)</label>
                <input type="tel" id="phone" maxlength="20" autocomplete="tel" placeholder="+966501234567">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required>
            </div>
            <div class="consent-group">
                <label class="consent-item" for="age_confirmed">
                    <input type="checkbox" id="age_confirmed" required>
                    <span>I confirm that I am <strong>18 years old or older</strong>.</span>
                </label>
                <label class="consent-item" for="terms_accepted">
                    <input type="checkbox" id="terms_accepted" required>
                    <span>I agree to the Vynzo <a href="terms.html" target="_blank" rel="noopener">Terms &amp; Conditions</a>, <a href="terms.html#guidelines" target="_blank" rel="noopener">Community Guidelines</a> and regulations.</span>
                </label>
            </div>
            <button type="submit" class="btn-submit">Register</button>
            <a href="../index.html" class="btn-cancel">Cancel</a>
        </form>
        <div class="auth-footer">
            Already have an account? <a href="login.html">Login</a>
        </div>
    </div>
    <script src="../js/password-toggle.js?v=1"></script>
    <script type="module" src="../js/auth.js?v=en1"></script>
</body>
</html>
