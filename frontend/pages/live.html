<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="icon" type="image/png" href="../assets/favicon-32.png">
    <title>Vynzo — Live Studio</title>
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/layout.css?v=20261031-prof">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/live.css?v=4">
    <link rel="stylesheet" href="../css/live-layout.css?v=12">
    <link rel="stylesheet" href="../css/responsive.css">
    <link rel="stylesheet" href="../css/mobile.css?v=2">
    <link rel="stylesheet" href="../css/sidebar-glow.css?v=3">
    <link rel="stylesheet" href="../css/theme.css?v=3">
    <script src="../js/theme.js?v=1"></script>
    <script src="../js/i18n.js?v=5"></script>
</head>
<body class="dark-theme">
    <div id="app-container">
        <aside class="sidebar desktop-nav">
            <div class="logo">
                <img class="brand-logo" src="../assets/icon-192.png" alt="Vynzo"><h2>Vynzo</h2>
            </div>
            <nav>
                <a href="../index.html" class="nav-item">Home</a>
                <a href="users.html" class="nav-item">Find people</a>
                <a href="messages.html" class="nav-item">Messages</a>
                <a href="live.html" class="nav-item active">Live</a>
                <a href="blogs.html" class="nav-item">Blogs</a>
                <a href="settings.html" class="nav-item">Settings</a>
            </nav>
        </aside>

        <main class="live-container">
            <div class="live-sidebar">
                <div style="padding: 16px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center;">
                    <span style="font-weight: 700;">Live Streams</span>
                    <button id="start-broadcast-btn" class="btn-live" style="font-size: 12px; padding: 6px 12px;">Go Live</button>
                </div>
                <div style="padding: 10px 16px; border-bottom: 1px solid var(--border-color);">
                    <div style="font-size:12px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--text-muted); margin-bottom:6px;">Your live title</div>
                    <div id="live-title-editor"></div>
                    <div class="live-audience-heading">Who can watch</div>
                    <div class="live-audience-picker">
                        <button id="live-audience-trigger" class="live-audience-trigger" type="button" aria-label="Who can watch your live" aria-haspopup="menu" aria-expanded="false" aria-controls="live-audience-menu">
                            <span id="live-audience-icon" class="live-audience-choice-icon" aria-hidden="true">&#127757;</span>
                            <span class="live-audience-choice-copy"><strong id="live-audience-label">Public</strong><small id="live-audience-summary">Anyone can watch your live</small></span>
                            <span class="live-audience-chevron" aria-hidden="true">&#9662;</span>
                        </button>
                        <div id="live-audience-menu" class="live-audience-menu" role="menu" aria-label="Choose who can watch" hidden>
                            <button type="button" class="live-audience-option is-active" role="menuitemradio" aria-checked="true" data-value="public" data-icon="&#127757;" data-label="Public" data-summary="Anyone can watch your live">
                                <span class="live-audience-option-icon" aria-hidden="true">&#127757;</span>
                                <span class="live-audience-option-copy"><strong>Public</strong><small>Anyone can watch your live</small></span>
                                <span class="live-audience-option-check" aria-hidden="true">&#10003;</span>
                            </button>
                            <button type="button" class="live-audience-option" role="menuitemradio" aria-checked="false" data-value="friends" data-icon="&#128101;" data-label="Friends only" data-summary="Your friends can watch">
                                <span class="live-audience-option-icon" aria-hidden="true">&#128101;</span>
                                <span class="live-audience-option-copy"><strong>Friends only</strong><small>Your friends can watch</small></span>
                                <span class="live-audience-option-check" aria-hidden="true">&#10003;</span>
                            </button>
                            <button type="button" class="live-audience-option" role="menuitemradio" aria-checked="false" data-value="selected" data-icon="&#128100;" data-label="Selected friends" data-summary="Only people you choose can watch">
                                <span class="live-audience-option-icon" aria-hidden="true">&#128100;</span>
                                <span class="live-audience-option-copy"><strong>Selected friends</strong><small>Only people you choose can watch</small></span>
                                <span class="live-audience-option-check" aria-hidden="true">&#10003;</span>
                            </button>
                        </div>
                        <select id="live-audience" class="live-audience-value" aria-hidden="true" tabindex="-1">
                            <option value="public">Public</option>
                            <option value="friends">Friends only</option>
                            <option value="selected">Selected friends</option>
                        </select>
                    </div>
                    <a id="live-audience-link" class="live-audience-link" href="live-audience.html" hidden>Choose friends</a>
                </div>
                <div id="live-streams-list" style="flex: 1; overflow-y: auto;">
                    <p style="padding: 16px; color: var(--text-muted);">Loading livestreams...</p>
                </div>
            </div>
            <div class="live-main-view" id="live-main-view">
                <div style="display: flex; justify-content: center; align-items: center; height: 100%; color: var(--text-muted);">
                    Select an active livestream or click "Go Live" to broadcast.
                </div>
            </div>
        </main>

        <nav class="mobile-nav">
            <a href="../index.html" class="mob-item"><span class="mob-icon">&#127968;</span>Home</a>
            <a href="users.html" class="mob-item"><span class="mob-icon">&#128269;</span>Find</a>
            <a href="messages.html" class="mob-item"><span class="mob-icon">&#128172;</span>Inbox</a>
            <a href="live.html" class="mob-item active"><span class="mob-icon">&#128308;</span>Live</a>
            <a href="blogs.html" class="mob-item"><span class="mob-icon">&#128221;</span>Blogs</a>
            <a href="settings.html" class="mob-item"><span class="mob-icon">&#9881;&#65039;</span>Settings</a>
        </nav>
    </div>

    <script type="module">
        import { initLiveStudio, startBroadcasting, exitBroadcasting, createTitleEditor, getSavedLiveTitle, getSelectedLiveAudience } from '../js/live.js?v=vis3';
        document.addEventListener('DOMContentLoaded', () => {
            initLiveStudio();

            const { element, input } = createTitleEditor({ value: getSavedLiveTitle(), autoSave: true });
            document.getElementById('live-title-editor').appendChild(element);
            const audience = document.getElementById('live-audience');
            const audienceLink = document.getElementById('live-audience-link');
            const audiencePicker = document.querySelector('.live-audience-picker');
            const audienceTrigger = document.getElementById('live-audience-trigger');
            const audienceMenu = document.getElementById('live-audience-menu');
            const audienceOptions = [...audienceMenu.querySelectorAll('.live-audience-option')];
            const audienceIcon = document.getElementById('live-audience-icon');
            const audienceLabel = document.getElementById('live-audience-label');
            const audienceSummary = document.getElementById('live-audience-summary');
            const closeAudienceMenu = () => {
                audienceMenu.hidden = true;
                audienceTrigger.setAttribute('aria-expanded', 'false');
            };
            const syncAudiencePicker = () => {
                const selectedOption = audienceOptions.find(option => option.dataset.value === audience.value);
                if (!selectedOption) return;
                audienceIcon.textContent = selectedOption.dataset.icon;
                audienceLabel.textContent = selectedOption.dataset.label;
                audienceSummary.textContent = selectedOption.dataset.summary;
                audienceOptions.forEach(option => {
                    const active = option === selectedOption;
                    option.classList.toggle('is-active', active);
                    option.setAttribute('aria-checked', String(active));
                });
            };
            try {
                const savedAudience = sessionStorage.getItem('vynzo_live_visibility');
                if (['public', 'friends', 'selected'].includes(savedAudience)) audience.value = savedAudience;
            } catch (error) {
                console.warn('Could not restore the livestream audience setting:', error);
            }
            const updateAudienceLink = () => {
                const selectedIds = getSelectedLiveAudience();
                audienceLink.hidden = audience.value !== 'selected';
                audienceLink.textContent = selectedIds.length
                    ? `Choose friends (${selectedIds.length} selected)`
                    : 'Choose friends';
                try {
                    sessionStorage.setItem('vynzo_live_visibility', audience.value);
                } catch (error) {
                    console.warn('Could not save the livestream audience setting:', error);
                }
                syncAudiencePicker();
            };
            audienceTrigger.addEventListener('click', () => {
                const opening = audienceMenu.hidden;
                audienceMenu.hidden = !opening;
                audienceTrigger.setAttribute('aria-expanded', String(opening));
                if (opening) audienceOptions.find(option => option.dataset.value === audience.value)?.focus();
            });
            audienceOptions.forEach(option => option.addEventListener('click', () => {
                audience.value = option.dataset.value;
                updateAudienceLink();
                closeAudienceMenu();
                audienceTrigger.focus();
            }));
            audienceOptions.forEach((option, index) => option.addEventListener('keydown', event => {
                let nextIndex;
                if (event.key === 'ArrowDown') nextIndex = (index + 1) % audienceOptions.length;
                if (event.key === 'ArrowUp') nextIndex = (index - 1 + audienceOptions.length) % audienceOptions.length;
                if (event.key === 'Home') nextIndex = 0;
                if (event.key === 'End') nextIndex = audienceOptions.length - 1;
                if (nextIndex !== undefined) {
                    event.preventDefault();
                    audienceOptions[nextIndex].focus();
                }
            }));
            document.addEventListener('click', event => {
                if (!audiencePicker.contains(event.target)) closeAudienceMenu();
            });
            document.addEventListener('keydown', event => {
                if (event.key === 'Escape' && !audienceMenu.hidden) {
                    closeAudienceMenu();
                    audienceTrigger.focus();
                }
            });
            audience.addEventListener('change', updateAudienceLink);
            updateAudienceLink();

            document.getElementById('start-broadcast-btn').addEventListener('click', () => {
                const title = input.value.trim();
                if (!title) {
                    input.focus();
                    input.style.borderColor = '#e5334b';
                    return;
                }
                const visibility = audience.value;
                const selectedIds = visibility === 'selected' ? getSelectedLiveAudience() : [];
                if (visibility === 'selected' && !selectedIds.length) {
                    window.location.href = 'live-audience.html';
                    return;
                }
                startBroadcasting(title, 'General', visibility, selectedIds);
            });
        });
    </script>
    <script type="module" src="../js/notifications.js?v=n2"></script>
</body>
</html>
