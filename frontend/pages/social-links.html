<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="vynzo-web-version" content="development">
    <link rel="icon" type="image/png" href="../assets/favicon-32.png">
    <title>Vynzo - Add links</title>
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/layout.css?v=20261031-prof">
    <link rel="stylesheet" href="../css/settings.css?v=compact-dropdown3">
    <link rel="stylesheet" href="../css/responsive.css">
    <link rel="stylesheet" href="../css/mobile.css?v=2">
    <link rel="stylesheet" href="../css/sidebar-glow.css?v=compact4">
    <link rel="stylesheet" href="../css/theme.css?v=3">
    <script src="../js/theme.js?v=1"></script>
    <script src="../js/i18n.js?v=8"></script>
</head>
<body class="dark-theme">
    <div id="app-container">
        <aside class="sidebar desktop-nav">
            <div class="logo">
                <img class="brand-logo" src="../assets/icon-192.png" alt="Vynzo"><h2>Vynzo</h2>
            </div>
            <nav>
                <a href="../index.html" class="nav-item">Home</a>
                <a href="users.html" class="nav-item">Find people</a>
                <a href="messages.html" class="nav-item">Messages</a>
                <a href="live.html" class="nav-item">Live</a>
                <a href="blogs.html" class="nav-item">Blogs</a>
                <a href="settings.html" class="nav-item active">Settings</a>
            </nav>
        </aside>
        <main class="main-content settings-page">
            <header class="settings-heading">
                <h1>Add links</h1>
                <p>Add your social media links or usernames to your profile.</p>
            </header>
            <section class="settings-card">
                <form id="social-links-form" class="profile-settings-form">
                    <label class="settings-field" for="profile-instagram">
                        <span>Instagram</span>
                        <input id="profile-instagram" name="instagram" type="text" maxlength="500" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="@username or https://www.instagram.com/username/" disabled>
                    </label>
                    <label class="settings-field" for="profile-facebook">
                        <span>Facebook</span>
                        <input id="profile-facebook" name="facebook" type="text" maxlength="500" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="username or https://www.facebook.com/username" disabled>
                    </label>
                    <label class="settings-field" for="profile-snapchat">
                        <span>Snapchat</span>
                        <input id="profile-snapchat" name="snapchat" type="text" maxlength="500" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="@username or https://www.snapchat.com/add/username" disabled>
                    </label>
                    <p>These links appear on your profile. Leave a field empty to remove its link.</p>
                    <div class="settings-form-footer">
                        <p id="social-links-status" class="settings-status" role="status" aria-live="polite">Loading links...</p>
                        <button class="settings-button" type="submit" disabled>Save links</button>
                    </div>
                </form>
                <button id="social-links-retry" class="settings-button settings-button-secondary" type="button" hidden>Try again</button>
                <a class="settings-button settings-button-secondary" href="settings.html">Back to settings</a>
            </section>
        </main>
        <nav class="mobile-nav">
            <a href="../index.html" class="mob-item"><span class="mob-icon">&#127968;</span>Home</a>
            <a href="users.html" class="mob-item"><span class="mob-icon">&#128269;</span>Find</a>
            <a href="messages.html" class="mob-item"><span class="mob-icon">&#128172;</span>Inbox</a>
            <a href="live.html" class="mob-item"><span class="mob-icon">&#128308;</span>Live</a>
            <a href="blogs.html" class="mob-item"><span class="mob-icon">&#128221;</span>Blogs</a>
            <a href="settings.html" class="mob-item active"><span class="mob-icon">&#9881;&#65039;</span>Settings</a>
        </nav>
    </div>
    <script type="module" src="../js/social-links.js?v=1"></script>
</body>
</html>
