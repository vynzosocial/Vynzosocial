<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="icon" type="image/png" href="../assets/favicon-32.png">
    <title>Vynzo — Messages</title>
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/layout.css?v=20261031-prof">
    <link rel="stylesheet" href="../css/messages.css?v=list1">
    <link rel="stylesheet" href="../css/messages-glow.css?v=2">
    <link rel="stylesheet" href="../css/responsive.css">
    <link rel="stylesheet" href="../css/mobile.css?v=2">
    <link rel="stylesheet" href="../css/sidebar-glow.css?v=3">
    <link rel="stylesheet" href="../css/theme.css?v=3">
    <script src="../js/theme.js?v=1"></script>
    <script src="../js/i18n.js?v=4"></script>
</head>
<body class="dark-theme messages-page">
    <div id="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar desktop-nav">
            <div class="logo">
                <img class="brand-logo" src="../assets/icon-192.png" alt="Vynzo"><h2>Vynzo</h2>
            </div>
            <nav>
                <a href="../index.html" class="nav-item">Home</a>
                <a href="users.html" class="nav-item">Find people</a>
                <a href="messages.html" class="nav-item active">Messages</a>
                <a href="live.html" class="nav-item">Live</a>
                <a href="blogs.html" class="nav-item">Blogs</a>
                <a href="settings.html" class="nav-item">Settings</a>
            </nav>
        </aside>

        <!-- Main Messaging Content -->
        <main class="messaging-container">
            <div class="conversations-sidebar">
                <div class="sidebar-header">
                    <span>Messages <span id="unread-total" class="unread-badge" hidden>0</span></span>
                    <span class="messages-header-sparkle" aria-hidden="true">&#10024;</span>
                </div>
                <div id="conversations-list" class="conversations-list">
                    <p style="padding: 16px; color: var(--text-muted);">Loading conversations...</p>
                </div>
            </div>
            <div class="chat-area" id="chat-area">
                <div class="chat-empty-state">
                    <span class="chat-empty-icon" aria-hidden="true">&#128172;</span>
                    Select a conversation to start chatting
                </div>
            </div>
        </main>

        <nav class="mobile-nav">
            <a href="../index.html" class="mob-item"><span class="mob-icon">&#127968;</span>Home</a>
            <a href="users.html" class="mob-item"><span class="mob-icon">&#128269;</span>Find</a>
            <a href="messages.html" class="mob-item active"><span class="mob-icon">&#128172;</span>Inbox</a>
            <a href="live.html" class="mob-item"><span class="mob-icon">&#128308;</span>Live</a>
            <a href="blogs.html" class="mob-item"><span class="mob-icon">&#128221;</span>Blogs</a>
            <a href="settings.html" class="mob-item"><span class="mob-icon">&#9881;&#65039;</span>Settings</a>
        </nav>
    </div>

    <script type="module">
        import { initMessaging } from '../js/messages.js?v=list1';
        document.addEventListener('DOMContentLoaded', () => {
            initMessaging();
        });
    </script>
    <script type="module" src="../js/notifications.js?v=n1"></script>
</body>
</html>
