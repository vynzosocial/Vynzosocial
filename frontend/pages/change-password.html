<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="icon" type="image/png" href="../assets/favicon-32.png">
    <title>Vynzo — Change password</title>
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/layout.css?v=20261031-prof">
    <link rel="stylesheet" href="../css/settings.css?v=20261101-equal">
    <link rel="stylesheet" href="../css/responsive.css">
    <link rel="stylesheet" href="../css/mobile.css?v=2">
    <link rel="stylesheet" href="../css/sidebar-glow.css?v=3">
    <link rel="stylesheet" href="../css/theme.css?v=3">
    <script src="../js/theme.js?v=1"></script>
    <script src="../js/i18n.js?v=5"></script>
</head>
<body class="dark-theme">
    <div id="app-container">
        <aside class="sidebar desktop-nav">
            <div class="logo">
                <img class="brand-logo" src="../assets/icon-192.png" alt="Vynzo"><h2>Vynzo</h2>
            </div>
            <nav>
                <a href="../index.html" class="nav-item">Home</a>
                <a href="users.html" class="nav-item">Find people</a>
                <a href="messages.html" class="nav-item">Messages</a>
                <a href="live.html" class="nav-item">Live</a>
                <a href="blogs.html" class="nav-item">Blogs</a>
                <a href="settings.html" class="nav-item active">Settings</a>
            </nav>
        </aside>

        <main class="main-content settings-page">
            <header class="settings-heading">
                <p class="settings-eyebrow">SECURITY</p>
                <h1>Change password</h1>
                <p>Enter your current password, then choose a new one.</p>
            </header>

            <section class="settings-card password-settings-card">
                <form id="change-password-form">
                    <label for="current-password">Current password</label>
                    <input type="password" id="current-password" autocomplete="current-password" required>
                    <label for="new-password">New password</label>
                    <input type="password" id="new-password" autocomplete="new-password" minlength="6" required>
                    <label for="confirm-new-password">Confirm new password</label>
                    <input type="password" id="confirm-new-password" autocomplete="new-password" minlength="6" required>
                    <button class="settings-button" type="submit">Update password</button>
                </form>
                <p id="change-password-status" class="settings-status" role="status" aria-live="polite"></p>
                <a class="settings-button settings-button-secondary" href="settings.html">Back to settings</a>
            </section>
        </main>

        <nav class="mobile-nav">
            <a href="../index.html" class="mob-item"><span class="mob-icon">&#127968;</span>Home</a>
            <a href="users.html" class="mob-item"><span class="mob-icon">&#128269;</span>Find</a>
            <a href="messages.html" class="mob-item"><span class="mob-icon">&#128172;</span>Inbox</a>
            <a href="live.html" class="mob-item"><span class="mob-icon">&#128308;</span>Live</a>
            <a href="blogs.html" class="mob-item"><span class="mob-icon">&#128221;</span>Blogs</a>
            <a href="settings.html" class="mob-item active"><span class="mob-icon">&#9881;&#65039;</span>Settings</a>
        </nav>
    </div>

    <script src="../js/password-toggle.js?v=1"></script>
    <script type="module" src="../js/change-password.js?v=1"></script>
</body>
</html>
