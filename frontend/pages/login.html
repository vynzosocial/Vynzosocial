<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="../assets/favicon-32.png">
    <title>Vynzo — Login</title>
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/reset.css">
    <style>
      body { display: flex; justify-content: center; align-items: center; height: 100vh; background: var(--bg-dark); color: var(--text-dark); }
      .auth-card { background: var(--card-dark); padding: 32px; border-radius: 12px; width: 100%; max-width: 400px; border: 1px solid var(--border-color); }
      .auth-card h2 { color: var(--primary); margin-bottom: 24px; text-align: center; }
      .form-group { margin-bottom: 16px; }
      .form-group label { display: block; margin-bottom: 6px; font-size: 14px; color: var(--text-muted); }
      .form-group input { width: 100%; padding: 10px; border-radius: 6px; background: var(--bg-dark); border: 1px solid var(--border-color); color: var(--text-dark); }
      .btn-submit { width: 100%; padding: 12px; background: var(--primary); color: white; font-weight: 600; border-radius: 6px; cursor: pointer; margin-top: 8px; }
      .btn-cancel { display: block; width: 100%; padding: 12px; margin-top: 8px; text-align: center; border: 1px solid var(--border-color, #444); border-radius: 6px; color: var(--text-muted); font-weight: 600; text-decoration: none; box-sizing: border-box; }
      .btn-cancel:hover { color: #fff; border-color: var(--primary); }
      .auth-footer { text-align: center; margin-top: 16px; font-size: 14px; color: var(--text-muted); }
      .auth-footer a { color: var(--primary); }
      .error { color: #ff3366; font-size: 13px; margin-bottom: 12px; text-align: center; }
      .save-login { display: flex; align-items: flex-start; gap: 8px; margin: 4px 0 12px; font-size: 14px; color: var(--text-muted); }
      .save-login input { flex: 0 0 auto; margin-top: 3px; }
      .password-manager-help { margin: 0 0 12px; color: var(--text-muted); font-size: 12px; }
      .saved-login-button { width: 100%; padding: 10px; margin-bottom: 8px; border: 1px solid var(--border-color); border-radius: 6px; background: transparent; color: var(--text-dark); cursor: pointer; }
      .saved-login-button[hidden], .btn-submit[hidden] { display: none; }
    </style>
    <link rel="stylesheet" href="../css/auth-layout.css?v=1">
    <link rel="stylesheet" href="../css/theme.css?v=3">
    <script src="../js/theme.js?v=1"></script>
    <script src="../js/i18n.js?v=saved-login1"></script>
</head>
<body class="dark-theme">
    <div class="auth-card">
        <h2>Vynzo Login</h2>
        <div id="error-message" class="error"></div>
        <form id="login-form">
            <div class="form-group">
                <label for="email">Email, username or phone number</label>
                <input type="text" id="email" name="username" required autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" maxlength="254">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required autocomplete="current-password">
            </div>
            <label class="save-login"><input type="checkbox" id="save-login"> Offer to save this login in my password manager</label>
            <p class="password-manager-help">Your browser or phone decides whether to save it. Avoid saving on shared devices.</p>
            <button type="button" class="saved-login-button" id="use-saved-login" hidden>Use a saved login</button>
            <button type="submit" id="login-submit" class="btn-submit">Login</button>
            <a href="../index.html" id="login-continue" class="btn-submit btn-cancel" hidden>Continue</a>
            <a href="../index.html" class="btn-cancel">Cancel</a>
        </form>
        <div class="auth-footer">
            <a href="forgot-password.html">Forgot your password?</a>
        </div>
        <div class="auth-footer">
            Don't have an account? <a href="register.html">Register</a>
        </div>
    </div>
    <script src="../js/password-toggle.js?v=1"></script>
    <script type="module" src="../js/auth.js?v=saved-login1"></script>
</body>
</html>
