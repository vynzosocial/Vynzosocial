apply plugin: 'com.android.application'

def releaseStoreFile = providers.environmentVariable('ANDROID_UPLOAD_STORE_FILE').orNull
def releaseStorePassword = providers.environmentVariable('ANDROID_UPLOAD_STORE_PASSWORD').orNull
def releaseKeyAlias = providers.environmentVariable('ANDROID_UPLOAD_KEY_ALIAS').orNull
def releaseKeyPassword = providers.environmentVariable('ANDROID_UPLOAD_KEY_PASSWORD').orNull
def hasReleaseSigning = [releaseStoreFile, releaseStorePassword, releaseKeyAlias, releaseKeyPassword].every { it }

android {
    namespace = "com.vynzosocial.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.vynzosocial.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 3
        versionName "1.2"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.credentials:credentials:1.6.0"
    implementation "androidx.credentials:credentials-play-services-auth:1.6.0"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

def validateReleaseSigning = tasks.register('validateReleaseSigning') {
    doLast {
        def missing = [
            ANDROID_UPLOAD_STORE_FILE: releaseStoreFile,
            ANDROID_UPLOAD_STORE_PASSWORD: releaseStorePassword,
            ANDROID_UPLOAD_KEY_ALIAS: releaseKeyAlias,
            ANDROID_UPLOAD_KEY_PASSWORD: releaseKeyPassword
        ].findAll { name, value -> !value }.keySet()

        if (missing) {
            throw new GradleException("Release signing is not configured. Set: ${missing.join(', ')}")
        }
        if (!file(releaseStoreFile).isFile()) {
            throw new GradleException("Release keystore not found: ${releaseStoreFile}")
        }
    }
}

tasks.configureEach {
    if (name in ['assembleRelease', 'bundleRelease', 'validateSigningRelease']) {
        dependsOn(validateReleaseSigning)
    }
}
