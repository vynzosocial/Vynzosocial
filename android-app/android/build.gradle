// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.5.1'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Capacitor 4 regenerates this plugin without the namespace required by modern AGP.
project(':capacitor-cordova-android-plugins') {
    plugins.withId('com.android.library') {
        android {
            if (!namespace) namespace 'capacitor.android.plugins'
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
