
workflows:
  ios-test-build:
    name: VynzoSocial iOS Simulator Test
    max_build_duration: 60
    instance_type: mac_mini_m2

    working_directory: android-app

    environment:
      xcode: latest
      cocoapods: default

    scripts:
      - name: Install dependencies
        script: |
          npm install

      - name: Synchronize Capacitor
        script: |
          npx cap sync ios

      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install

      - name: Build unsigned iOS Simulator app
        script: |
          xcodebuild build \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios/DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

    artifacts:
      - android-app/build/ios/DerivedData/Build/Products/Debug-iphonesimulator/*.app
      - /tmp/xcodebuild_logs/*.log
